[main]
font=monospace:size=11
pad=10x8
[colors]
alpha=0.92
background=1e1f28
foreground=e6e6ea
[key-bindings]
# Ctrl+Insert / Shift+Insert copy and paste too: with the macOS keyboard style, ⌘C/⌘V
# arrive as those keys, so they work here without taking Ctrl+C away from the shell.
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste
primary-paste=none

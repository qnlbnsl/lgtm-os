# LGTM OS macOS keyboard style: hold Super (⌘) for the usual Mac shortcuts.
# Installed to /etc/keyd/lgtm-mac.conf by lgtm-keys. Keys not listed here keep Super,
# so the desktop's own ⌘ shortcuts (⌘Space, ⌘Q, ⌘Tab, ...) still work.
#
# Copy/paste/cut use Ctrl+Insert / Shift+Insert / Shift+Delete: they work in GTK, Qt,
# browsers, Electron, Windows apps and the terminal, without breaking Ctrl+C there.
[ids]
*

[meta]
c = C-insert
v = S-insert
x = S-delete
z = C-z
a = C-a
s = C-s
f = C-f
t = C-t
w = C-w
r = C-r
n = C-n
o = C-o
p = C-p
l = C-l
left = home
right = end
backspace = C-backspace

[meta+shift]
z = C-S-z
t = C-S-t
n = C-S-n

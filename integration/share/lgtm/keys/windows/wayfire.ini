# Windows style. Tap Super for the launcher.

[fast-switcher]
activate = <alt> KEY_TAB

[scale]
toggle = <super> KEY_TAB
toggle_all = <super> <shift> KEY_TAB

[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT

[wm-actions]
toggle_fullscreen = KEY_F11 | <super> <shift> KEY_ENTER
minimize = <super> KEY_DOWN
toggle_showdesktop = <super> KEY_D

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> <shift> KEY_DOWN

[command]
binding_launcher = <super>
command_launcher = fuzzel
binding_search = <super> KEY_S
command_search = fuzzel
binding_terminal = <ctrl> <alt> KEY_T | <super> KEY_ENTER
command_terminal = foot
binding_files = <super> KEY_E
command_files = thunar
binding_agent = <super> KEY_A
command_agent = lgtm-agent
binding_shot_full = KEY_SYSRQ
command_shot_full = lgtm-screenshot full
binding_shot_region = <super> <shift> KEY_S
command_shot_region = lgtm-screenshot region
binding_lock = <super> KEY_L
command_lock = lgtm-lock
binding_taskmgr = <ctrl> <shift> KEY_ESC
command_taskmgr = foot -e top
binding_power = <ctrl> <alt> KEY_DELETE
command_power = lgtm-power
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_lightup = KEY_BRIGHTNESSUP
command_lightup = brightnessctl set +5%
repeatable_binding_lightdown = KEY_BRIGHTNESSDOWN
command_lightdown = brightnessctl set 5%-

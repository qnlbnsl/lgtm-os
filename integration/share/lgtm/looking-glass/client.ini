; LGTM OS Looking Glass client defaults (lgtm-vm passes this with -C; your own
; ~/.config/looking-glass/client.ini is read too and wins).
; One Windows screen, fullscreen on the monitor it opens on.
[app]
shmFile=/dev/kvmfr0

[win]
title=Windows
fullScreen=yes
jitRender=yes

[input]
; Right Ctrl toggles input capture (Super stays with the desktop unless captured).
escapeKey=KEY_RIGHTCTRL
rawMouse=yes

[spice]
; Clipboard both ways; audio and microphone go through SPICE too.
clipboardToVM=yes
clipboardToLocal=yes

[audio]
micDefault=allow

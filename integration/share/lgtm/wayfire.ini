# LGTM OS glass mode (Wayfire). lgtm-session builds the running config from this file
# plus the keyboard style (keys/<style>/wayfire.ini) into $XDG_RUNTIME_DIR/lgtm/.
# To customise, copy the generated file to ~/.config/wayfire.ini; lgtm-session prefers it.

[core]
plugins = alpha animate autostart blur command decoration fast-switcher foreign-toplevel grid gtk-shell idle move place resize scale vswitch window-rules wm-actions wobbly xdg-activation wayfire-shell
close_top_view = @CLOSE_TOP_VIEW@
focus_button_with_modifier = false
xwayland = true

[autostart]
autostart_wf_shell = false
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_CONFIG_DIRS XDG_DATA_DIRS PATH LGTM_MODE XCURSOR_THEME XCURSOR_SIZE
bg = swaybg -m fill -i "@WALLPAPER@"
bar = waybar -c $LGTM_RUN/waybar.jsonc -s $LGTM_RUN/waybar.css
menus = lgtm-menu-sync
first_login = lgtm-setup --first-login

[blur]
method = kawase
kawase_iterations = 2
kawase_offset = 4
kawase_degrade = 2
mode = normal

[decoration]
border_size = 0
title_height = 30
font = Inter 10
button_order = @BUTTON_ORDER@
active_color = @DECOR_ACTIVE@
inactive_color = @DECOR_INACTIVE@

[animate]
open_animation = zoom
close_animation = zoom
duration = 160

[place]
mode = center

[input]
xkb_layout = us
natural_scroll = true
tap_to_click = true


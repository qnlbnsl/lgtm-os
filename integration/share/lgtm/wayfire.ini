# LGTM OS glass mode (Wayfire). Started by lgtm-session.
# To customise, copy to ~/.config/wayfire.ini; lgtm-session prefers that file.

[core]
plugins = alpha animate autostart blur command decoration fast-switcher foreign-toplevel gtk-shell idle move place resize scale vswitch window-rules wm-actions wobbly xdg-activation wayfire-shell
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_button_with_modifier = false
xwayland = true

[autostart]
autostart_wf_shell = false
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE LGTM_MODE
bg = swaybg -m fill -i /usr/share/lgtm/wallpaper.png
bar = waybar -c $LGTM_RUN/waybar.jsonc -s $LGTM_RUN/waybar.css
menus = lgtm-menu-sync

[blur]
method = kawase
kawase_iterations = 2
kawase_offset = 4
kawase_degrade = 2
mode = normal

[decoration]
border_size = 0
title_height = 30
font = Inter 10
button_order = close minimize maximize
active_color = 0.13 0.13 0.16 0.70
inactive_color = 0.10 0.10 0.12 0.55

[animate]
open_animation = zoom
close_animation = zoom
duration = 160

[place]
mode = center

[input]
xkb_layout = us
natural_scroll = true
tap_to_click = true

[scale]
toggle = <super> KEY_TAB
toggle_all = <super> <shift> KEY_TAB

[fast-switcher]
activate = <alt> KEY_TAB

[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT

[wm-actions]
toggle_fullscreen = <super> KEY_F
minimize = <super> KEY_M

[command]
binding_launcher = <super> KEY_SPACE
command_launcher = fuzzel
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_files = <super> KEY_E
command_files = thunar
binding_power = <super> KEY_ESC
command_power = lgtm-power
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_lightup = KEY_BRIGHTNESSUP
command_lightup = brightnessctl set +5%
repeatable_binding_lightdown = KEY_BRIGHTNESSDOWN
command_lightdown = brightnessctl set 5%-

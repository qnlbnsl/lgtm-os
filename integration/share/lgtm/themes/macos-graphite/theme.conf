# LGTM OS theme: macOS Graphite. Neutral AppKit grays, Apple system colours in the
# terminal, hairline borders, WhiteSur icons and the macOS cursor.
# Needs the packages in ./packages (lgtm-theme installs them; they're in the offline repo).
LABEL="macOS Graphite"
WALLPAPER_STYLE=graphite
LITE_BG="#1e1e1e"

FG=dddddd  FG_DIM=8c8c8c  BG=1e1e1e  BG_ALT=323232
ACCENT=8c8c8c  SELECTION=464646  RED=ff453a

BAR_GLASS="rgba(30, 30, 30, 0.45)"        BAR_LITE="rgba(30, 30, 30, 0.92)"
DOCK_GLASS="rgba(255, 255, 255, 0.12)"    DOCK_LITE="rgba(50, 50, 50, 0.90)"
BORDER="rgba(255, 255, 255, 0.18)"        HAIRLINE="rgba(255, 255, 255, 0.07)"
TOOLTIP="rgba(30, 30, 30, 0.94)"
DECOR_ACTIVE="0.196 0.196 0.196 0.80"     DECOR_INACTIVE="0.157 0.157 0.157 0.65"
TITLE_ACTIVE=323232  TITLE_INACTIVE=282828

ICON_THEME=WhiteSur-dark
CURSOR_THEME=macOS  CURSOR_SIZE=24

PALETTE=(1e1e1e ff453a 32d74b ffd60a 0a84ff bf5af2 64d2ff dddddd
         464646 ff6961 5de377 ffe066 409cff da8fff 8ae0ff ffffff)

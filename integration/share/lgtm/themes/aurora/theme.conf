# LGTM OS theme: Aurora (default). Blue-violet glass over a soft aurora gradient.
# Sourced by lgtm-session (bash). Colours: hex without '#' where a tool wants that.
LABEL="Aurora (blue glass)"
WALLPAPER_STYLE=aurora           # wallpaper.png in this folder, generated at package build
LITE_BG="#1d2b3a"                # lite mode: solid background colour (no wallpaper in RAM)

FG=f5f5f7  FG_DIM=9a9aa2  BG=1e1f28  BG_ALT=2a2c36
ACCENT=7fd3ff  SELECTION=3d6bf0  RED=ff6b6b

BAR_GLASS="rgba(28, 28, 34, 0.30)"        BAR_LITE="rgba(32, 34, 44, 0.85)"
DOCK_GLASS="rgba(255, 255, 255, 0.16)"    DOCK_LITE="rgba(60, 64, 80, 0.80)"
BORDER="rgba(255, 255, 255, 0.28)"        HAIRLINE="rgba(255, 255, 255, 0.10)"
TOOLTIP="rgba(30, 30, 36, 0.92)"
# Wayfire title bars: "r g b a" in 0..1.
DECOR_ACTIVE="0.13 0.13 0.16 0.70"        DECOR_INACTIVE="0.10 0.10 0.12 0.55"
TITLE_ACTIVE=2a2c36  TITLE_INACTIVE=22232b

ICON_THEME=Papirus-Dark
CURSOR_THEME=Adwaita  CURSOR_SIZE=24

# Terminal: black red green yellow blue magenta cyan white, then the bright ones.
PALETTE=(1e1f28 ff6b6b 5de377 ffd166 6ea8ff c792ea 7fd3ff e6e6ea
         4a4c58 ff8787 7ef29a ffe08a 8fbaff d7a6f5 a3e1ff ffffff)

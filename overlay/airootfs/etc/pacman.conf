[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
[multilib]
Include = /etc/pacman.d/mirrorlist

# LGTM OS's offline extras (Darling for Mac apps). Built by build.sh.
[lgtm]
SigLevel = Optional TrustAll
Server = file:///var/lib/lgtm/repo
